name: Public starter checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb xauth
      - run: python3 -B scripts/test_agentspace.py -v
      - run: python3 -B scripts/test_desktop.py -v
      - run: python3 -B scripts/test_devspace_gui.py -v
      - run: python3 scripts/check_public.py --self-test
      - run: python3 scripts/check_public.py --staged --history
      - run: xvfb-run -a python3 -B scripts/desktop.py --smoke-test
      - run: xvfb-run -a python3 -B scripts/devspace_gui.py --smoke-ui
  windows-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B scripts/test_agentspace.py -v
      - run: python -B scripts/test_desktop.py -v
      - run: python -B scripts/test_devspace_gui.py -v
