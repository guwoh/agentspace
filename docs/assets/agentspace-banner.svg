<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-labelledby="title description">
  <title id="title">AgentSpace</title>
  <desc id="description">A portable workspace connecting AI sessions with local project context.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101d35"/>
      <stop offset="1" stop-color="#1c3455"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8dd9f8"/>
      <stop offset="1" stop-color="#54c9a9"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="270" rx="24" fill="url(#bg)"/>
  <g fill="none" stroke="#89b6d5" opacity=".12">
    <path d="M730 0v270M790 0v270M850 0v270M910 0v270M970 0v270M700 45h300M700 105h300M700 165h300M700 225h300"/>
