    <text x="57" y="151" font-size="25" font-weight="500" fill="#d2e2f2">Your projects. Your context. Any AI.</text>
    <text x="57" y="188" font-size="17" fill="#9cb5cf">Portable Markdown handoffs, prompts and private workspaces.</text>
    <text x="57" y="229" font-size="12" letter-spacing="2" font-weight="600" fill="#7cd8c7">LOCAL-FIRST  /  OPEN SOURCE  /  DESKTOP + CLI</text>
  </g>
